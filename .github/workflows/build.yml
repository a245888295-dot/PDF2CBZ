name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project
        run: |
          unzip -o *.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Root Directory and Build
        run: |
          # 自动寻找项目根目录
          ROOT_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          echo "Root project found in: $ROOT_DIR"
          cd "$ROOT_DIR"
          
          # 生成 Gradle 9.0 包装器
          gradle wrapper --gradle-version 9.0
          chmod +x gradlew
          
          # 【暴力修复】在所有 XML 文件中搜索并替换出错的 Material 主题
          echo "Fixing Theme errors in all XML files..."
          find . -type f -name "*.xml" -exec sed -i 's|android:style/Theme.Material.DayNight.NoActionBar|android:style/Theme.Material.Light.NoActionBar|g' {} +
          find . -type f -name "*.xml" -exec sed -i 's|android:Theme.Material.DayNight.NoActionBar|android:Theme.Material.Light.NoActionBar|g' {} +
          
          # 验证一下是否还有漏网之鱼
          echo "Checking for remaining Theme references..."
          grep -rn "Theme.Material" . || echo "No more Theme.Material references found."
          
          # 开始编译
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PDF2CBZ-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
