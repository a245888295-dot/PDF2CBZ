name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 同一分支连续 push 时取消上一次未完成的构建，省 Actions 分钟数
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'cmake;3.30.5'
          accept-licenses: true

      - name: Unzip Project
        run: |
          if ls *.zip >/dev/null 2>&1; then
            unzip -o *.zip
          else
            echo "::error::仓库根目录没有 .zip 工程包，构建无法继续"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cloud Patch and Build
        run: |
          ROOT_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -z "$ROOT_DIR" ]; then
            echo "::error::未找到 settings.gradle.kts，无法定位工程根目录"
            exit 1
          fi
          echo "Root project found in: $ROOT_DIR"

          cp patch.py "$ROOT_DIR/"
          cp icon_patch.py "$ROOT_DIR/"
          cd "$ROOT_DIR"
          python3 patch.py

          # v3.9.0: 图标 + 应用名 + UI 文案 + 版本号
          python3 icon_patch.py

          find . -type f -name "*.xml" -exec sed -i 's|android:style/Theme.Material.DayNight.NoActionBar|android:style/Theme.Material.Light.NoActionBar|g' {} +

          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PDF2CBZ-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
