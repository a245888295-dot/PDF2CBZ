name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project
        run: |
          unzip -o *.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Project and Build
        run: |
          # 自动寻找包含 build.gradle.kts 的文件夹
          PROJECT_DIR=$(find . -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project folder not found!"
            exit 1
          fi
          echo "Project found in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # 生成 gradlew 启动器 (指定稳定版本)
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          
          # 开始编译
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PDF2CBZ-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
