name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project
        run: |
          unzip -o *.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Root Directory and Build
        run: |
          # 自动寻找包含 settings.gradle.kts 或 settings.gradle 的根目录
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            ROOT_DIR="."
          else
            ROOT_DIR=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1 | xargs dirname)
          fi
          
          if [ -z "$ROOT_DIR" ]; then
            echo "ERROR: Root project not found!"
            exit 1
          fi
          
          echo "Root project found in: $ROOT_DIR"
          cd "$ROOT_DIR"
          
          # 在根目录生成 gradlew (已修复报错)
          gradle wrapper --gradle-version 9.0
          chmod +x gradlew
          
          # 开始编译
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PDF2CBZ-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
