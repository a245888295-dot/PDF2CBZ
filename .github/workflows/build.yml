name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project
        run: |
          unzip -o *.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Root Directory and Build
        run: |
          # 自动寻找包含 settings.gradle.kts 的根目录
          ROOT_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          echo "Root project found in: $ROOT_DIR"
          cd "$ROOT_DIR"
          
          # 在根目录生成 gradlew (确保使用 9.0 版本)
          gradle wrapper --gradle-version 9.0
          chmod +x gradlew
          
          # 【关键一步】自动修改 themes.xml，修复 AI 写错的代码
          echo "Fixing themes.xml..."
          find . -name "themes.xml" -exec sed -i 's|android:style/Theme.Material.DayNight.NoActionBar|android:Theme.Material.Light.NoActionBar|g' {} +
          
          # 开始编译
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PDF2CBZ-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
